<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cardiac cycle</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(820px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>
.cc{--cc-blood:#c2414b;--cc-blood-op:.34;--cc-cell:#9a1f2b}
.iso[data-theme="dark"] .cc{--cc-blood:#e0606a;--cc-blood-op:.30;--cc-cell:#ff8f97}
.cc .cc-cavity{fill:var(--anatomy-shade-0)}
.cc .cc-bore{fill:var(--anatomy-shade-1)}
.cc .cc-blood{fill:var(--cc-blood);fill-opacity:var(--cc-blood-op)}
.cc .cc-port{fill:var(--anatomy-shade-2)}
.cc .cc-cell{fill:var(--cc-cell)}
.cc .cc-leaf{fill:var(--anatomy-top);stroke:var(--anatomy-hi);stroke-width:.5}
.cc .cc-leaf[data-on]{fill:var(--anatomy-lit-top);stroke:var(--anatomy-lit)}
.cc .cc-ring{fill:var(--anatomy-shade-3);stroke:var(--anatomy-lo);stroke-width:.4}
.cc .cc-piston{fill:var(--anatomy-top);stroke:var(--anatomy-hi);stroke-width:.6}
.cc .cc-rod{fill:var(--anatomy-shade-3);stroke:var(--anatomy-mid);stroke-width:.5}
.cc .cc-glare{fill:var(--anatomy-hi);opacity:.07}
.cc .cc-paper{fill:var(--anatomy-top)}
.cc .cc-band{fill:var(--cc-blood);fill-opacity:.09}
.cc .cc-trace{stroke-width:.8}
.cc .cc-trace-ao{stroke:var(--anatomy-mid);stroke-width:.9}
.cc .cc-trace-lv{stroke-width:.9}
.cc .cc-grid{stroke:var(--anatomy-faint);stroke-width:.25;fill:none;opacity:.6}
.cc .cc-trace-ao{stroke-dasharray:none}
.cc .cc-trace-la{stroke:var(--cc-cell);opacity:.8}
.cc .cc-pen-la{fill:var(--cc-cell)}
.cc .cc-pen{fill:var(--anatomy-mid)}
.cc .cc-pen-lv{fill:var(--anatomy-hi)}
.cc .cc-pen.cc-pen-la{fill:var(--cc-cell)}
.cc-controls{display:grid;gap:14px;margin:18px 0 0;font-family:var(--anatomy-mono);font-size:12px;color:var(--anatomy-text)}
.cc-row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.cc-controls label{display:flex;gap:10px;align-items:center;flex:1 1 260px}
.cc-controls input[type=range]{flex:1;accent-color:var(--anatomy-strong);min-width:120px}
.cc-controls output{min-width:64px;text-align:right;color:var(--anatomy-strong)}
.cc-btn{font:inherit;color:var(--anatomy-text);background:transparent;border:1px solid var(--anatomy-mid);padding:7px 12px;cursor:pointer;border-radius:0}
.cc-btn[aria-pressed="true"]{background:var(--anatomy-strong);color:var(--anatomy-card);border-color:var(--anatomy-strong)}
.cc-btn:focus-visible,.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.cc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--anatomy-mid);border:1px solid var(--anatomy-mid)}
.cc-stats div{background:var(--anatomy-card);padding:9px 10px;display:grid;gap:4px}
.cc-stats span{color:var(--anatomy-muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.cc-stats b{font-weight:500;color:var(--anatomy-strong);font-size:14px}
.cc-phase{display:flex;gap:4px;flex-wrap:wrap}
.cc-phase span{padding:4px 7px;border:1px solid var(--anatomy-faint);color:var(--anatomy-muted);font-size:10.5px;letter-spacing:.04em}
.cc-phase span[data-on]{border-color:var(--anatomy-strong);color:var(--anatomy-strong)}
.cc-note{color:var(--anatomy-muted);font-size:11.5px;line-height:1.6;margin:0}
.cc-legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--anatomy-muted);font-size:11px}
.cc-legend i{display:inline-block;width:18px;height:0;border-top:1.4px solid var(--anatomy-hi);vertical-align:middle;margin-right:6px}
.cc-legend i.ao{border-color:var(--anatomy-mid)}
.cc-legend i.la{border-color:var(--cc-cell)}
.iso-plate-corner[data-corner="readout"]{white-space:normal;text-align:right;max-width:62%}
@media (max-width:560px){.cc .iso-plate{overflow:hidden;padding:44px 12px 60px}.cc .iso-plate-corner[data-corner="hint"]{display:none}.cc .iso-plate-corner[data-corner="readout"]{max-width:100%}.cc .iso-stage svg{width:122%;margin:0 -11%}}

// Lumped left-heart model: time-varying elastance atrium and ventricle,
// two non-return valves, a windkessel aorta and a venous reservoir.
// Units: mL, mmHg, s. One beat starts at the onset of ventricular activation.

const NORMAL = {
  hr: 75,
  lv: { emax: 3.0, emin: 0.075, v0: 10 },
  la: { emax: 0.28, emin: 0.16, v0: 4 },
  ao: { c: 1.2, v0: 0 },
  ven: { c: 40, v0: 0 },
  rSys: 1.05,
  rVen: 0.05,
  mitral: { r: 0.004, k: 0.00002 },
  aortic: { r: 0.001, k: 0.000006 },
  total: 800,
};

// Aortic stenosis: a small valve orifice, quadratic loss (Bernoulli, dP = k Q^2).
const STENOSIS_K = 0.0009;
// Mitral regurgitation: a fixed leak through the closed mitral valve.
const LEAK_K = 0.006;

// Double-Hill ventricular activation, normalised to a peak of 1.
const hill = (tn) => {
  const a = Math.pow(tn / 0.7, 1.9);
  const b = Math.pow(tn / 1.17, 21.9);
  return (a / (1 + a)) * (1 / (1 + b));
};
let HILL_PEAK = 0;
for (let i = 0; i <= 2000; i++) HILL_PEAK = Math.max(HILL_PEAK, hill((i / 2000) * 2));

function timing(hr) {
  const T = 60 / hr;
  const tMax = 0.2 + 0.15 * T; // time to peak elastance
  const atrialDur = 0.11;
  const atrialStart = T - 0.12; // atrial contraction ends as the ventricle activates
  return { T, tMax, atrialDur, atrialStart };
}

function lvActivation(t, tm) {
  return hill(t / tm.tMax) / HILL_PEAK;
}

function laActivation(t, tm) {
  const u = (t - tm.atrialStart) / tm.atrialDur;
  return u > 0 && u < 1 ? Math.sin(Math.PI * u) ** 2 : 0;
}

// Flow through an orifice with linear (viscous) and quadratic (inertial) loss.
const orifice = (dp, r, k) => {
  if (dp <= 0) return 0;
  if (k <= 0) return dp / r;
  return (-r + Math.sqrt(r * r + 4 * k * dp)) / (2 * k);
};

// Simulate to steady state and return one beat of samples.
function simulate({ hr = NORMAL.hr, stenosis = false, regurgitation = false, samples = 400 } = {}) {
  const p = NORMAL;
  const tm = timing(hr);
  const aorticK = stenosis ? STENOSIS_K : p.aortic.k;
  const dt = 0.0002;
  // initial volumes
  let vlv = 120, vla = 60, vao = 100, vven = p.total - vlv - vla - vao;
  const beats = 14;
  const steps = Math.round(tm.T / dt);
  const out = [];
  for (let beat = 0; beat < beats; beat++) {
    const last = beat === beats - 1;
    const every = Math.max(1, Math.floor(steps / samples));
    for (let i = 0; i < steps; i++) {
      const t = i * dt;
      const elv = p.lv.emin + (p.lv.emax - p.lv.emin) * lvActivation(t, tm);
      const ela = p.la.emin + (p.la.emax - p.la.emin) * laActivation(t, tm);
      const plv = elv * (vlv - p.lv.v0);
      const pla = ela * (vla - p.la.v0);
      const pao = (vao - p.ao.v0) / p.ao.c;
      const pven = (vven - p.ven.v0) / p.ven.c;
      const qmv = orifice(pla - plv, p.mitral.r, p.mitral.k);
      const qmr = regurgitation ? orifice(plv - pla, 0.02, LEAK_K) : 0;
      const qav = orifice(plv - pao, p.aortic.r, aorticK);
      const qsys = (pao - pven) / p.rSys;
      const qven = Math.max(0, (pven - pla) / p.rVen);
      if (last && i % every === 0) {
        out.push({ t, plv, pla, pao, vlv, vla, qmv, qmr, qav, alv: lvActivation(t, tm), ala: laActivation(t, tm) });
      }
      vlv += (qmv - qmr - qav) * dt;
      vla += (qven - qmv + qmr) * dt;
      vao += (qav - qsys) * dt;
      vven += (qsys - qven) * dt;
    }

  return { tm, hr, stenosis, regurgitation, beat: annotate(out, tm) };
}

// Phase names and heart-sound events, read from the valves.
function annotate(beat, tm) {
  const open = 0.5; // mL/s counts as flowing
  const firstEject = beat.findIndex((s) => s.qav > open);
  const lastEject = beat.length - 1 - [...beat].reverse().findIndex((s) => s.qav > open);
  let peak = 0;
  for (let i = lastEject; i < beat.length; i++) peak = Math.max(peak, beat[i].qmv);
  let pastPeak = false;
  beat.forEach((s, i) => {
    s.mitral = s.qmv > open;
    s.aortic = s.qav > open;
    if (i > lastEject && s.qmv >= peak * 0.999) pastPeak = true;
    if (s.aortic) s.phase = "ejection";
    else if (i > lastEject && s.t >= tm.atrialStart) s.phase = "atrial systole";
    else if (i < firstEject) s.phase = "isovolumic contraction";
    else if (!s.mitral && !pastPeak) s.phase = "isovolumic relaxation";
    else if (s.mitral && !pastPeak) s.phase = "rapid filling";
    else if (s.mitral && s.qmv > peak * 0.3) s.phase = "rapid filling";
    else s.phase = "diastasis";
  });
  const n = beat.length;
  for (let i = 0; i < n; i++) {
    const prev = beat[(i - 1 + n) % n];
    const s = beat[i];
    s.s1 = prev.phase !== "isovolumic contraction" && s.phase === "isovolumic contraction";
    s.s2 = prev.aortic && !s.aortic;
  }
  return beat;
}

function summary(run) {
  const b = run.beat;
  const max = (f) => Math.max(...b.map(f));
  const min = (f) => Math.min(...b.map(f));
  const edv = max((s) => s.vlv);
  const esv = min((s) => s.vlv);
  const sv = edv - esv;
  const dt = b[1].t - b[0].t;
  const forward = b.reduce((a, s) => a + s.qav * dt, 0);
  const back = b.reduce((a, s) => a + s.qmr * dt, 0);
  return {
    edv, esv, sv, ef: sv / edv,
    forwardSV: forward, regurgitant: back,
    co: (forward * run.hr) / 1000,
    aoSys: max((s) => s.pao), aoDia: min((s) => s.pao),
    lvSys: max((s) => s.plv), lvEdp: b[0].plv,
    laMean: b.reduce((a, s) => a + s.pla, 0) / b.length, laMax: max((s) => s.pla),
    gradient: max((s) => (s.aortic ? s.plv - s.pao : 0)),
  };
}

  move(parts.index, cz);
  parts.rod.innerHTML = solidSvg(cylinder(C.ROD[0], C.ROD[1], C.ROD_R, C.CHAMBER_H + 5, cz - C.CHAMBER_H - 5, P, 18), { tone: "hi", crease: "none", lit: true });
  C.POSTS.forEach(([x, y], i) => {
    const z0 = cz + CROSS_H + 2;
    parts.postUp[i].innerHTML = solidSvg(cylinder(x, y, C.POST_R, z0, C.YOKE_Z - z0, P, 24), { tone: "mid", crease: "none" });
    const coil = coilZ(x, y, 5, C.CHAMBER_H + 3, cz, 6, P);
    parts.coilBack[i].setAttribute("d", coil.back);
    parts.coilFront[i].setAttribute("d", coil.front);
  });
  const pz = pistonAt(v);
  parts.piston.setAttribute("transform", `translate(0 ${r1(-pz)})`);
  parts.lvBlood.setAttribute("d", rectD(C.BORE.x0, C.CH_WIN.z0 - 1, C.BORE.x1, pz + 0.3));
}

function drawAtrium(vla) {
  const w = C.ATRIUM_WIN, z = clamp(LA_LEVEL(vla), w.z0 + 2, w.z1 - 2);
  parts.laBlood.setAttribute("d", rectD(w.x0 - 1, w.z0 - 1, w.x1 + 1, z));
  parts.laSurface.setAttribute("d", `M${w.x0 - 1} ${r1(-z)}H${w.x1 + 1}`);
}

function setLeaf(kind, angle, gap) {
  const L = parts.leaf[kind];
  const hingeTop = L.top.dataset.hinge, hingeBot = L.bottom.dataset.hinge;
  // top flap hangs down from the upper wall; bottom flap stands up from the lower wall
  L.top.setAttribute("transform", `rotate(${r1(-angle - gap)} ${hingeTop})`);
  L.bottom.setAttribute("transform", `rotate(${r1(angle + gap)} ${hingeBot})`);
}

function drawValves(s, dt) {
  const rate = still.matches ? 1 : 1 - Math.exp(-dt / 0.035);
  // flaps open with the forward flow through them
  const mitralOpen = 72 * smoothstep(0, 120, s.qmv);
  const aorticMax = state.stenosis ? 20 : 72;
  const aorticOpen = aorticMax * smoothstep(0, state.stenosis ? 60 : 160, s.qav);
  // regurgitant flaps are pushed back past the closed line by LV pressure and leave a gap
  const prolapse = state.regurgitation ? -16 * smoothstep(5, 60, s.plv - s.pla) : 0;
  state.leaf.mitral += (mitralOpen + prolapse - state.leaf.mitral) * rate;
  state.leaf.aortic += (aorticOpen - state.leaf.aortic) * rate;
  setLeaf("mitral", state.leaf.mitral, 0);
  setLeaf("aortic", state.leaf.aortic, 0);
  for (const kind of ["mitral", "aortic"]) {
    const open = kind === "mitral" ? s.qmv > 0.5 : s.qav > 0.5;
    for (const el of Object.values(parts.leaf[kind])) el.firstChild.toggleAttribute("data-on", open);
  }
  // pointer of the adjuster screws: a quarter turn when engaged
  const kr = still.matches ? 1 : 1 - Math.exp(-dt / 0.25);
  for (const [kind, on] of [["mitral", state.regurgitation], ["aortic", state.stenosis]]) {
    state.knob[kind] += ((on ? 1 : 0) - state.knob[kind]) * kr;
    const box = kind === "mitral" ? C.MITRAL : C.AORTIC;
    const kx = box.x + box.w / 2, ky = box.y + box.d / 2 - 3, a = state.knob[kind] * Math.PI / 2;
    parts.knob[kind].setAttribute("d", lineOnTop([kx, ky], [kx + Math.cos(a) * 4.4, ky + Math.sin(a) * 4.4], 38 + 9.6, P));
  }
}

function drawCells(s, dtModel) {
  // blood cells drift with the flow through each passage
  const flowDots = (key, x0, x1, q, zMid, spread) => {
    const list = state.dot[key], els = parts.dots[key];
    const speed = q / 220; // window widths per second at a given flow, mL/s
    list.forEach((d, i) => {
      d.s = (((d.s + speed * dtModel) % 1) + 1) % 1;
      const x = lerp(x0, x1, d.s);
      const edge = smoothstep(0, 0.12, d.s) * smoothstep(1, 0.88, d.s);
      const alpha = edge * smoothstep(2, 30, Math.abs(q));
      els[i].setAttribute("cx", r1(x));
      els[i].setAttribute("cy", r1(-(zMid + d.j * spread)));
      els[i].setAttribute("opacity", alpha.toFixed(2));
    });
  };
  const mw = VALVE_WIN(C.MITRAL), aw = VALVE_WIN(C.AORTIC);
  flowDots("mitral", mw.x0, mw.x1, s.qmv - s.qmr, C.PORT.mid, 10);
  flowDots("aortic", aw.x0, aw.x1, s.qav, C.PORT.mid, 10);
  flowDots("lv", C.BORE.x0 + 2, C.BORE.x1 - 2, s.qmv - s.qmr + s.qav, C.PORT.mid + 2, 12);
  const w = C.ATRIUM_WIN;
  flowDots("la", w.x0 + 4, w.x1 + 1, s.qmv - s.qmr, C.PORT.mid, 10);
}

function drawGauges(s) {
  parts.needle.la.setAttribute("d", needleD(C.GAUGES.la, s.pla, P));
  parts.needle.lv.setAttribute("d", needleD(C.GAUGES.lv, s.plv, P));
  parts.needle.ao.setAttribute("d", needleD(C.GAUGES.ao, s.pao, P));
}

// ---------- the chart recorder ----------
const PPS = (C.PEN_X - C.PAPER.x0) / C.CHART_SECONDS;
function prefill() {
  state.history = [];
  const step = 0.004;
  for (let t = state.clock - C.CHART_SECONDS - 0.05; t <= state.clock; t += step) {
    const ph = state.phase - (state.clock - t) / state.run.tm.T;
    const s = sampleRun(state.run, ph);
    state.history.push({ t, plv: s.plv, pao: s.pao, pla: s.pla, ej: s.qav > 0.5, phase: s.phase });
  }
}
function record(s) {
  const h = state.history;
  const last = h[h.length - 1];
  if (!last || state.clock - last.t >= 0.003) h.push({ t: state.clock, plv: s.plv, pao: s.pao, pla: s.pla, ej: s.qav > 0.5, phase: s.phase });
  while (h.length && h[0].t < state.clock - C.CHART_SECONDS - 0.1) h.shift();
}
function drawChart(s) {
  const h = state.history;
  const xs = (t) => r1(C.PEN_X - (state.clock - t) * PPS);
  const trace = (key) => h.map((p, i) => `${i ? "L" : "M"}${xs(p.t)} ${r1(-chartZ(p[key]))}`).join("");
  parts.trace.lv.setAttribute("d", trace("plv"));
  parts.trace.ao.setAttribute("d", trace("pao"));
  parts.trace.la.setAttribute("d", trace("pla"));
  let bands = "", ticks = "", start = null;
  for (let i = 0; i < h.length; i++) {
    const p = h[i], q = h[i - 1];
    if (p.ej && start === null) start = p.t;
    if ((!p.ej || i === h.length - 1) && start !== null) { bands += rectD(xs(start), C.PAPER.z0, xs(p.t), C.PAPER.z1); start = null; }
    if (q) {
      const s1 = p.phase === "isovolumic contraction" && q.phase !== "isovolumic contraction";
      const s2 = q.ej && !p.ej;
      if (s1 || s2) { const x = xs(p.t); ticks += `M${x} ${-C.PAPER.z0}V${-(C.PAPER.z0 + (s1 ? 3.4 : 2.2))}`; }
    }
  }
  parts.bands.setAttribute("d", bands);
  parts.ticks.setAttribute("d", ticks);
  for (const key of ["lv", "ao", "la"]) parts.pen[key].setAttribute("cy", r1(-chartZ(s[key === "lv" ? "plv" : key === "ao" ? "pao" : "pla"])));
}

// ---------- words ----------
const NOTES = {
  "atrial systole": "The atrium contracts and tops up the ventricle: the last 15–20% of filling, the a wave. The mitral flaps are still open.",
  "isovolumic contraction": "The ventricle contracts with both valves shut. Pressure climbs fast while volume stays at end-diastolic. Mitral closure is S1.",
  "ejection": "LV pressure is above aortic, so the aortic flaps open and the stroke volume leaves. The air chamber stores part of it, like the elastic aorta.",
  "isovolumic relaxation": "The ventricle relaxes with both valves shut again. Aortic closure is S2 (the dicrotic notch). Volume holds at end-systolic.",
  "rapid filling": "LV pressure drops below LA pressure, the mitral flaps open and blood rushes in. Most filling happens here.",
  "diastasis": "Slow filling: pressures in atrium and ventricle are nearly equal. This is the part that shortens most at high heart rates.",
};
function phaseNote(s) {
  let note = NOTES[s.phase];
  if (state.stenosis && s.phase === "ejection") note += ` Stenosis: the narrow orifice holds LV pressure ${Math.round(s.plv - s.pao)} mmHg above the aorta, a systolic ejection murmur.`;
  if (state.regurgitation && (s.phase === "isovolumic contraction" || s.phase === "ejection" || s.phase === "isovolumic relaxation") && s.qmr > 2) note += ` Regurgitation: ${Math.round(s.qmr)} mL/s leaks back into the atrium, so the "isovolumic" phases are not isovolumic (holosystolic murmur, tall LA v wave).`;
  return note;
}
let lastWords = "";
function writeWords(s) {
  const text = `${s.phase} · LV ${Math.round(s.plv)} · Ao ${Math.round(s.pao)} · LA ${Math.round(s.pla)} mmHg · ${Math.round(s.vlv)} mL`;
  if (readout.textContent !== text) readout.textContent = text;
  if (s.phase !== lastWords) {
    lastWords = s.phase;
    for (const el of document.querySelectorAll("[data-phase]")) el.toggleAttribute("data-on", el.dataset.phase === s.phase);
    stage.setAttribute("aria-valuetext", `${s.phase}, LV volume ${Math.round(s.vlv)} mL`);
  }
  const note = phaseNote(s);
  const el = ui("[data-note]");
  if (el.textContent !== note) el.textContent = note;
  ui("[data-scrub-out]").textContent = `${Math.round(s.t * 1000)} ms`;
  if (!scrubbing) ui("[data-scrub]").value = String(Math.round((state.phase % 1) * 1000));
  stage.setAttribute("aria-valuenow", String(Math.round((state.phase % 1) * 100)));
}
function writeStats() {
  const m = state.sum, rf = m.regurgitant / (m.forwardSV + m.regurgitant);
  const cells = [
    ["EDV", `${Math.round(m.edv)} mL`], ["ESV", `${Math.round(m.esv)} mL`], ["Stroke vol.", `${Math.round(m.sv)} mL`],
    ["EF", `${Math.round(m.ef * 100)}%`], ["Cardiac output", `${m.co.toFixed(1)} L/min`], ["Aortic BP", `${Math.round(m.aoSys)}/${Math.round(m.aoDia)}`],
    ["LV peak", `${Math.round(m.lvSys)} mmHg`], ["LVEDP", `${Math.round(m.lvEdp)} mmHg`], ["LA peak", `${Math.round(m.laMax)} mmHg`],
    ["Peak AV gradient", `${Math.round(m.gradient)} mmHg`], ["Regurgitant frac.", m.regurgitant > 0.5 ? `${Math.round(rf * 100)}%` : "—"],
    ["Systole", `${Math.round(state.run.beat.filter((b) => b.phase === "isovolumic contraction" || b.phase === "ejection").length / state.run.beat.length * state.run.tm.T * 1000)} ms`],
  ];
  ui("[data-stats]").innerHTML = cells.map(([a, b]) => `<div><span>${a}</span><b>${b}</b></div>`).join("");
}

// ---------- heart sounds ----------
let audio = null, murmur = null;
function ensureAudio() {
  if (audio) return;
  audio = new AudioContext();
  const len = audio.sampleRate * 2, buf = audio.createBuffer(1, len, audio.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = audio.createBufferSource(); src.buffer = buf; src.loop = true;
  const band = audio.createBiquadFilter(); band.type = "bandpass"; band.frequency.value = 320; band.Q.value = 1.4;
  const gain = audio.createGain(); gain.gain.value = 0;
  src.connect(band).connect(gain).connect(audio.destination); src.start();
  murmur = { gain, band };
}
function thump(freq, level) {
  if (!audio || !state.sound) return;
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.6, t + 0.09);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(level, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.14);
}
function soundFor(prev, s) {
  if (!audio) return;
  let target = 0;
  if (state.sound && state.playing) {
    if (state.stenosis && s.qav > 0.5) target = 0.05 * smoothstep(10, 70, s.plv - s.pao) * smoothstep(0, 250, s.qav);
    if (state.regurgitation && s.qmr > 2) { target = Math.max(target, 0.035 * smoothstep(2, 120, s.qmr)); murmur.band.frequency.value = 520; }
    else murmur.band.frequency.value = 300;
  }
  murmur.gain.gain.setTargetAtTime(target, audio.currentTime, 0.02);
  if (!prev || !state.playing) return;
  if (s.phase === "isovolumic contraction" && prev.phase !== "isovolumic contraction") thump(62, 0.5);
  if (prev.aortic && !s.aortic) thump(90, 0.32);
}

// ---------- loop ----------
let frame = 0, last = 0, visible = false, scrubbing = false, prevSample = null;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  let dtModel = 0;
  if (state.hover !== null) {
    const target = state.hover, d = ((target - (state.phase % 1)) % 1 + 1.5) % 1 - 0.5;
    const stepTo = still.matches ? d : d * (1 - Math.exp(-dt / 0.12));
    state.phase += stepTo; dtModel = stepTo * state.run.tm.T; state.clock += dtModel;
    if (dtModel < 0) prefill();
  } else if (state.playing) {
    dtModel = dt * SPEEDS[state.speed];
    state.phase += dtModel / state.run.tm.T;
    state.clock += dtModel;
  }
  if (state.phase > 1e6) state.phase %= 1;
  if (state.mix < 1) state.mix = Math.min(1, state.mix + dt / 1.2);
  draw(dt, Math.max(0, dtModel));
  const settled = !state.playing && state.hover === null && state.mix >= 1 && Math.abs(state.leaf.mitral - targetLeaf("mitral")) < 0.05 && Math.abs(state.leaf.aortic - targetLeaf("aortic")) < 0.05 && Math.abs(state.knob.mitral - (state.regurgitation ? 1 : 0)) < 0.002 && Math.abs(state.knob.aortic - (state.stenosis ? 1 : 0)) < 0.002;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
function targetLeaf(kind) { return kind === "mitral" ? state.leaf.mitral : state.leaf.aortic; }
function draw(dt, dtModel) {
  const s = current();
  drawDrive(s.vlv);
  drawAtrium(s.vla);
  drawValves(s, dt * Math.max(SPEEDS[state.speed], 0.25));
  drawCells(s, dtModel);
  drawGauges(s);
  record(s);
  drawChart(s);
  writeWords(s);
  soundFor(prevSample, s);
  prevSample = s;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };

// ---------- input ----------
const playBtn = ui("[data-play]");
const setPlaying = (on) => { state.playing = on; playBtn.textContent = on ? "Pause" : "Play"; playBtn.setAttribute("aria-pressed", String(on)); run(); };
playBtn.addEventListener("click", () => setPlaying(!state.playing));
const scrub = ui("[data-scrub]");
scrub.addEventListener("input", () => { scrubbing = true; setPlaying(false); state.phase = Math.floor(state.phase) + Number(scrub.value) / 1000; prefill(); run(); });
scrub.addEventListener("change", () => { scrubbing = false; });
const hr = ui("[data-hr]");
hr.addEventListener("input", () => { state.hr = Number(hr.value); ui("[data-hr-out]").textContent = `${state.hr} bpm`; recompute(); run(); });
const speed = ui("[data-speed]");
speed.addEventListener("input", () => { state.speed = Number(speed.value); ui("[data-speed-out]").textContent = SPEED_LABEL[state.speed]; });
const toggle = (sel, key) => {
  const btn = ui(sel);
  btn.addEventListener("click", () => { state[key] = !state[key]; btn.setAttribute("aria-pressed", String(state[key])); recompute(); run(); });
};
toggle("[data-as]", "stenosis");
toggle("[data-mr]", "regurgitation");
const soundBtn = ui("[data-sound]");
soundBtn.addEventListener("click", () => { state.sound = !state.sound; soundBtn.setAttribute("aria-pressed", String(state.sound)); if (state.sound) { ensureAudio(); audio.resume(); } });

stage.addEventListener("pointermove", (e) => {
  if (e.pointerType === "touch") return;
  const box = svg.getBoundingClientRect();
  state.hover = clamp((e.clientX - box.left) / box.width, 0, 0.999);
  run();
});
stage.addEventListener("pointerleave", () => { state.hover = null; run(); });
stage.addEventListener("keydown", (e) => {
  const step = (e.shiftKey ? 0.1 : 0.02) / state.run.tm.T;
  if (e.key === "ArrowRight") state.phase += step;
  else if (e.key === "ArrowLeft") { state.phase -= step; if (state.phase < 0) state.phase += 1; }
  else if (e.key === " " || e.key === "Enter") { setPlaying(!state.playing); e.preventDefault(); return; }
  else if (e.key === "Home") state.phase = Math.floor(state.phase);
  else return;
  e.preventDefault();
  setPlaying(false);
  prefill();
  run();
});
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) setPlaying(false);

recompute();
state.phase = 0.05;
prefill();
draw(1, 0);
</script></body></html>
